name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies to install: the suite uses Node's built-in test runner.
      # ubuntu-latest ships Chrome, which the page tests need. REQUIRE_BROWSER
      # makes that load-bearing: if the browser ever goes missing the run fails
      # rather than quietly skipping every page test and staying green.
      - run: node --test
        env:
          REQUIRE_BROWSER: "1"
