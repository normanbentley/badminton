name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies to install: the suite uses Node's built-in test runner.
      # ubuntu-latest ships Chrome, which the page smoke test uses.
      - run: node --test
