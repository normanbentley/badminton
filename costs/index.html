<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#166534">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Who Pays">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23166534'/%3E%3Cg transform='translate(3.2 -4.5) rotate(-125 32 32)'%3E%3Cpath d='M26 40 L15 12 Q32 4 49 12 L38 40 Q32 43 26 40 Z' fill='white'/%3E%3Cpath d='M29 39 L24 9 M35 39 L40 9' stroke='%23166534' stroke-width='3' fill='none'/%3E%3Cpath d='M26 44 h12 v2 a6 6 0 0 1 -12 0 Z' fill='white'/%3E%3C/g%3E%3C/svg%3E">
<title>Who Pays What</title>
<style>
  :root {
    --accent: #166534;
    --bg: #fafaf9;
    --card: #ffffff;
    --line: #e7e5e4;
    --ink: #1c1917;
    --mut: #78716c;
    --faint: #f5f5f4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { padding: 20px 16px 12px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0; display: flex; align-items: center; gap: 8px; }
  h1 .shu { flex: 0 0 auto; color: var(--ink); }
  .back { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--mut); text-decoration: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; }
  footer { padding: 20px 16px 8px; text-align: center; font-size: 12px; color: #a8a29e; }
  main { padding: 0 16px; }
  .card { border: 1px solid var(--line); background: var(--card); border-radius: 16px; margin-bottom: 12px; padding: 12px 16px 14px; }
  .card h2 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .row .lbl { font-size: 14px; color: #57534e; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 42px; height: 42px; border: 0; border-radius: 10px;
    background: var(--faint); color: #57534e; font-size: 22px; font-weight: 600;
    cursor: pointer; transition: transform .05s;
  }
  .stepper button:active { transform: scale(0.94); }
  .stepper button:disabled { opacity: .35; }
  .stepper .v { min-width: 36px; text-align: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stepper input.v { width: 56px; height: 42px; border: 1px solid var(--line); border-radius: 10px; background: #fff; outline: none; padding: 0; }
  .stepper input.v:focus { border-color: var(--accent); }
  input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input.money {
    width: 96px; border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 10px 12px; font-size: 16px; font-weight: 600; text-align: right; outline: none;
    font-variant-numeric: tabular-nums;
  }
  input.money:focus { border-color: var(--accent); }
  .mini { display: flex; gap: 4px; background: #e7e5e4; border-radius: 10px; padding: 3px; }
  .mini button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--mut); cursor: pointer; }
  .mini button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .calc { margin: 6px 0 0; padding-top: 8px; border-top: 1px solid var(--faint); font-size: 13px; color: var(--mut); font-variant-numeric: tabular-nums; }
  .owe { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--faint); }
  .owe:last-of-type { border-bottom: 0; }
  .owe .who { font-size: 15px; font-weight: 600; }
  .owe .who small { display: block; font-size: 12px; font-weight: 500; color: var(--mut); margin-top: 1px; }
  .owe .amt { font-size: 24px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .owe .amt small { font-size: 13px; font-weight: 500; color: var(--mut); }
  .owe .amt .ex { display: block; font-size: 12px; font-weight: 500; color: var(--mut); margin-top: 1px; }
  .hint { padding: 20px 0; text-align: center; font-size: 14px; color: #a8a29e; }
  .math { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--faint); font-size: 13px; color: var(--mut); line-height: 1.5; font-variant-numeric: tabular-nums; }
  .math b { color: #44403c; font-weight: 600; }
  .math .nw { white-space: nowrap; }
  .rhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .rhead .tot { font-size: 14px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .hbtn { margin-left: auto; border: 1px solid #b9dcc6; background: #f2faf5; color: var(--accent); font-size: 13px; font-weight: 600; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  input.will-reset { border-color: #86efac !important; background: #f0fdf4; color: var(--accent); transition: background .3s, border-color .3s, color .3s; }
  .copybtn { width: 100%; margin-top: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .05s; }
  .copybtn:active { transform: scale(0.98); }
  .toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: #1c1917; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><svg class="shu" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><g transform="translate(3.2 -4.5) rotate(-125 32 32)"><path d="M26 40 L15 12 Q32 4 49 12 L38 40 Q32 43 26 40 Z" fill="#fff"/><path d="M29 39 L24 9 M35 39 L40 9" stroke="var(--accent)" stroke-width="3" fill="none"/><path d="M26 44 h12 v2 a6 6 0 0 1 -12 0 Z" fill="#fff"/></g></svg>Who Pays What<button class="hbtn" onclick="newSession()">New session</button><a class="back" id="backlink" href="../" hidden>All apps</a></h1>
  </header>

  <main>
    <section class="card">
      <h2>Courts</h2>
      <div class="row">
        <span class="lbl">Session length</span>
        <div class="mini">
          <button id="h2" onclick="setHours(2)">2 hours</button>
          <button id="h3" onclick="setHours(3)">3 hours</button>
        </div>
      </div>
      <div class="row">
        <span class="lbl">Courts</span>
        <div class="stepper">
          <button onclick="bump('courts',-1)" id="courts-minus">−</button>
          <input class="v" id="in-courts" type="number" inputmode="numeric" min="1" onfocus="selectAll(this)" oninput="setCount('courts', this.value)" onblur="render()">
          <button onclick="bump('courts',1)" id="courts-plus">+</button>
        </div>
      </div>
      <div class="row">
        <span class="lbl">Rate per court, per hour</span>
        <input class="money" id="in-rate" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0.00" onfocus="selectAll(this)" oninput="setNum('rate', this.value)">
      </div>
      <p class="calc" id="courtCalc"></p>
    </section>

    <section class="card">
      <h2>Shuttles</h2>
      <div class="row">
        <span class="lbl">Shuttles used</span>
        <div class="stepper">
          <button onclick="bump('shuttles',-1)" id="shuttles-minus">−</button>
          <input class="v" id="in-shuttles" type="number" inputmode="numeric" min="0" onfocus="selectAll(this)" oninput="setCount('shuttles', this.value)" onblur="render()">
          <button onclick="bump('shuttles',1)" id="shuttles-plus">+</button>
        </div>
      </div>
      <div class="row">
        <span class="lbl">Price each</span>
        <input class="money" id="in-sprice" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0.00" onfocus="selectAll(this)" oninput="setNum('sprice', this.value)">
      </div>
      <p class="calc" id="shuttleCalc"></p>
    </section>

    <section class="card">
      <h2>Players</h2>
      <div id="playerRows"></div>
      <p class="calc" id="playerCalc"></p>
    </section>

    <section class="card">
      <div class="rhead">
        <h2>Each person owes</h2>
        <span class="tot" id="tot"></span>
      </div>
      <div id="owes"></div>
      <div class="math" id="math"></div>
      <button class="copybtn" id="copyBtn" onclick="copySummary()" hidden>Copy for group chat</button>
    </section>
  </main>

  <footer>Everything is saved on this phone only. Nothing is sent anywhere.</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = "badminton-costs-v1";
const RANGES = { courts:[1, Infinity], shuttles:[0, Infinity], p1:[0, Infinity], p2:[0, Infinity], p3:[0, Infinity] };
const DEF = { hours:3, courts:2, rate:0, shuttles:0, sprice:0, p1:0, p2:0, p3:0 };
let S = load();

function intIn(v, [min, max], def) {
  return Number.isInteger(v) && v >= min && v <= max ? v : def;
}
function numIn(v) {
  return typeof v === "number" && isFinite(v) && v >= 0 ? v : 0;
}
function load() {
  const s = { ...DEF };
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && typeof d === "object") {
      if (d.hours === 2 || d.hours === 3) s.hours = d.hours;
      for (const k of Object.keys(RANGES)) s[k] = intIn(d[k], RANGES[k], DEF[k]);
      s.rate = numIn(d.rate);
      s.sprice = numIn(d.sprice);
    }
  } catch {}
  return s;
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
}

// Select the whole value on focus so typing replaces it (no deleting the 0
// first). Deferred because iOS Safari drops select() called during focus.
function selectAll(el) { setTimeout(() => el.select(), 0); }

const fmt = n => "$" + n.toFixed(2);
const round2 = n => Math.round(n * 100) / 100;

function bump(key, d) {
  const [min, max] = RANGES[key];
  S[key] = Math.min(max, Math.max(min, S[key] + d));
  persist(); render();
}
function setNum(key, raw) {
  const v = parseFloat(raw);
  S[key] = isFinite(v) && v >= 0 ? round2(v) : 0;
  persist(); render(true);
}
function setCount(key, raw) {
  const v = parseInt(raw, 10);
  const [min, max] = RANGES[key];
  S[key] = isFinite(v) ? Math.min(max, Math.max(min, v)) : min;
  persist(); render(true);
}
function setHours(h) {
  if (h === S.hours) return;
  // Going 3h -> 2h: "played the whole session" players stay whole-session.
  if (h === 2) { S.p2 = Math.min(RANGES.p2[1], S.p2 + S.p3); S.p3 = 0; }
  S.hours = h;
  persist(); render();
}
function hoursList() { return S.hours === 3 ? [3, 2, 1] : [2, 1]; }

function calc() {
  const courtCost = round2(S.courts * S.hours * S.rate);
  const shuttleCost = round2(S.shuttles * S.sprice);
  const totalCents = Math.round(courtCost * 100) + Math.round(shuttleCost * 100);
  const total = totalCents / 100;
  const buckets = hoursList().map(h => ({ h, n: S["p" + h] })).filter(b => b.n > 0);
  const ph = buckets.reduce((a, b) => a + b.h * b.n, 0);
  const players = buckets.reduce((a, b) => a + b.n, 0);
  // Share ceiling in integer cents: the quotient is rational with denominator
  // ph*50, so Math.ceil is exact and rounding is always up, never down.
  const shareFor = h => ph ? Math.ceil(totalCents * h / (ph * 50)) * 50 / 100 : 0;
  const exactFor = h => ph ? round2(totalCents * h / ph / 100) : 0;
  return { courtCost, shuttleCost, total, buckets, ph, players, ratePH: ph ? total / ph : 0, shareFor, exactFor };
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

// New session: resets counts immediately, flashing the fields that changed.
let resetFlashTimer = null;
function newSession() {
  S.shuttles = 0; S.p1 = 0; S.p2 = 0; S.p3 = 0;
  persist(); render();
  setResetHighlights(true);
  toast("Shuttles and players reset, everything else kept");
  clearTimeout(resetFlashTimer);
  resetFlashTimer = setTimeout(() => setResetHighlights(false), 1800);
}
function setResetHighlights(on) {
  for (const id of ["in-shuttles", ...hoursList().map(h => "in-p" + h)]) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("will-reset", on);
  }
}

function copySummary() {
  const { total, buckets, shareFor } = calc();
  if (!buckets.length) return;
  const date = new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  const lines = [`Badminton ${date}: total ${fmt(total)}`];
  for (const b of buckets) lines.push(`${b.h}h: ${fmt(shareFor(b.h))} each (×${b.n})`);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(lines.join("\n"))
      .then(() => toast("Copied for the group chat"))
      .catch(() => toast("Copy failed"));
  } else toast("Copy not available");
}

// Rebuild only when the session length changes; rebuilding while the user
// types in one of the count inputs would steal focus mid-keystroke.
let builtHours = null;
function renderPlayerRows() {
  if (builtHours === S.hours) return;
  builtHours = S.hours;
  document.getElementById("playerRows").innerHTML = hoursList().map(h => `
    <div class="row">
      <span class="lbl">Played ${h} hour${h > 1 ? "s" : ""}</span>
      <div class="stepper">
        <button onclick="bump('p${h}',-1)" id="p${h}-minus">−</button>
        <input class="v" id="in-p${h}" type="number" inputmode="numeric" min="0" value="${S["p"+h]}" onfocus="selectAll(this)" oninput="setCount('p${h}', this.value)" onblur="render()">
        <button onclick="bump('p${h}',1)" id="p${h}-plus">+</button>
      </div>
    </div>`).join("");
}

function render(skipInputs) {
  document.getElementById("h2").classList.toggle("on", S.hours === 2);
  document.getElementById("h3").classList.toggle("on", S.hours === 3);

  renderPlayerRows();
  for (const k of Object.keys(RANGES)) {
    const minus = document.getElementById(k + "-minus"), plus = document.getElementById(k + "-plus");
    if (minus) minus.disabled = S[k] <= RANGES[k][0];
    if (plus) plus.disabled = S[k] >= RANGES[k][1];
  }
  if (!skipInputs) {
    document.getElementById("in-rate").value = S.rate || "";
    document.getElementById("in-sprice").value = S.sprice || "";
    document.getElementById("in-courts").value = S.courts;
    document.getElementById("in-shuttles").value = S.shuttles;
    for (const h of hoursList()) document.getElementById("in-p" + h).value = S["p" + h];
  }

  const { courtCost, shuttleCost, total, buckets, ph, players, ratePH, shareFor, exactFor } = calc();

  document.getElementById("courtCalc").textContent =
    `${S.courts} court${S.courts > 1 ? "s" : ""} × ${S.hours}h × ${fmt(S.rate)} = ${fmt(courtCost)}`;
  document.getElementById("shuttleCalc").textContent =
    `${S.shuttles} × ${fmt(S.sprice)} = ${fmt(shuttleCost)}`;
  document.getElementById("playerCalc").textContent = players
    ? `${players} player${players > 1 ? "s" : ""} · ${ph} player-hours`
    : "No players yet";
  document.getElementById("tot").textContent = total > 0 ? "Total " + fmt(total) : "";

  const owes = document.getElementById("owes");
  const math = document.getElementById("math");
  document.getElementById("copyBtn").hidden = !players;
  if (!players) {
    owes.innerHTML = `<p class="hint">Add who played to see shares.</p>`;
    math.textContent = "";
    return;
  }

  owes.innerHTML = buckets.map(b => {
    const exact = exactFor(b.h);
    const amt = shareFor(b.h);
    return `<div class="owe">
      <div class="who">${b.h} hour${b.h > 1 ? "s" : ""}<small>× ${b.n} player${b.n > 1 ? "s" : ""}</small></div>
      <div class="amt">${fmt(amt)} <small>each</small>${amt !== exact ? `<span class="ex">exact ${fmt(exact)}</span>` : ""}</div>
    </div>`;
  }).join("");

  const collected = buckets.reduce((a, b) => a + shareFor(b.h) * b.n, 0);
  const diff = round2(collected - total);
  const note = diff !== 0
    ? `Rounded up to the nearest 50c. Collects <b>${fmt(collected)}</b> (${fmt(diff)} rounding difference).`
    : `Rounded to the nearest 50c. Collects exactly <b>${fmt(collected)}</b>.`;
  math.innerHTML = `${fmt(courtCost)} courts + ${fmt(shuttleCost)} shuttles = <b>${fmt(total)}</b> ÷ ${ph} player-hours ≈ <span class="nw"><b>${fmt(ratePH)}</b>/hour</span><br>${note}`;
}

// Show the hub back link only on browsers that have visited the landing page.
try {
  if (localStorage.getItem("badminton-hub-v1")) document.getElementById("backlink").hidden = false;
} catch {}

render();
</script>
</body>
</html>
